syntax = "proto3";

package lazyproto.bench.lightproto;

option java_package = "io.lazyproto.bench.lightproto";
option java_outer_classname = "LightOrderProto";
option java_multiple_files = true;

message UserProfile {
  int64 user_id = 1;
  string city = 2;
  int32 vip_level = 3;
  double score = 4;
  string email = 5;
}

message LineItem {
  int64 item_id = 1;
  string sku = 2;
  int32 quantity = 3;
  int64 price_cents = 4;
  string description = 5;
}

message OrderEnvelope {
  int64 order_id = 1;
  string buyer_name = 2;
  int32 status = 3;
  fixed64 updated_at_fixed64 = 4;
  UserProfile user = 5;
  repeated LineItem items = 6;
  bytes payload = 7;
  string auth_token = 8;
  string trace_id = 9;
  int64 total_cents = 10;
}
