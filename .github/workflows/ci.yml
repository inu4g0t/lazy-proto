name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  java-21:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build All Modules & Run Correctness + Fuzz Tests (Zero-Dep Core + Compat + Benchmarks)
        run: mvn test

  cpp-20:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Protobuf C++ toolchain
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev
      - name: Build & Run C++20 Correctness + Fuzzers (O3)
        run: make -C cpp test
      - name: Build & Run C++20 Correctness + Fuzzers (-DNDEBUG)
        run: make -C cpp test-ndebug
      - name: Build & Run C++20 Correctness + Fuzzers (ASan + UBSan)
        run: make -C cpp test-asan
      - name: Compile C++20 Benchmark Binary
        run: make -C cpp benchmark_cpp
